name: example_with_gradle
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: dummy
        default: dummy

jobs:

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: run with gradle
        run: |
          cd example_gradle_linux/
          ./gradlew run

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Display the path
        run: echo %PATH%
        shell: cmd

      - name: java-version
        run: java -version
        shell: bash

      - name: run with gradle
        shell: bash
        run: |
          cd example_gradle_linux/
          ./gradlew run


